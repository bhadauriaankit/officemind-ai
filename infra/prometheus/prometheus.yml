# Prometheus scrape configuration for OfficeMind AI (Phase 12)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'officemind-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'officemind-backend'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
