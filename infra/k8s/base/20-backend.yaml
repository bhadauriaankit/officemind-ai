apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: officemind-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: officemind-ai/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/$(POSTGRES_DB)"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: officemind-core-secrets, key: POSTGRES_USER }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: officemind-core-secrets, key: POSTGRES_PASSWORD }
            - name: SPRING_REDIS_HOST
              value: "redis"
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: officemind-core-secrets, key: REDIS_PASSWORD }
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: officemind-core-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: officemind-core-secrets, key: MINIO_ROOT_PASSWORD }
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: QDRANT_HOST
              value: "qdrant"
            - name: QDRANT_PORT
              value: "6334"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: officemind-core-secrets, key: POSTGRES_DB }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: officemind-ai
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
