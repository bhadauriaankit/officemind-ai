# Placeholder Secret manifest for local/dev clusters only.
# In staging/production this is replaced by an ExternalSecret (Phase 13
# hardens this with Sealed Secrets / Vault / cloud secret manager), never
# committed with real values.
apiVersion: v1
kind: Secret
metadata:
  name: officemind-core-secrets
  namespace: officemind-ai
type: Opaque
stringData:
  POSTGRES_DB: officemind
  POSTGRES_USER: officemind_app
  POSTGRES_PASSWORD: change_me_strong_password
  REDIS_PASSWORD: change_me_strong_password
  MINIO_ROOT_USER: officemind_minio_admin
  MINIO_ROOT_PASSWORD: change_me_strong_password
